<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12301f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Truc">
<title>Truc de la Colla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: tapete a pantalla completa pensado para el móvil.
   Vertical: marcador arriba, mesa en el centro, tu mano abajo.
   Horizontal: mesa a la izquierda; marcador, botones y tu mano en una columna a la derecha. */
:root{
  --felt:#1d4a37; --felt-hi:#24593f; --felt-deep:#12301f;
  --chalk:#f1ece0; --chalk-dim:#b9c7b8;
  --card:#fbf7ec; --card-edge:#cdbf9c; --ink:#221d17;
  --us:#f0c04a; --them:#ec8a6a; --back1:#7e1b17; --back2:#9c2b24;
  --btn:#f1ece0; --btn-ink:#1a2a20; --hot:#f0c04a;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--felt-deep);color:var(--chalk);font-family:var(--f-body);font-size:14px}
#app{height:100%;max-width:1180px;margin:0 auto;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 80% at 50% 45%,var(--felt-hi),var(--felt) 55%,var(--felt-deep))}
button{font-family:var(--f-body);cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

/* ---- Estructura de la partida ---- */
.game{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"score" "table" "dock";
  user-select:none;-webkit-user-select:none}
.score{grid-area:score;display:flex;align-items:center;gap:10px;padding-block:10px 6px;border-bottom:1px solid rgba(241,236,224,.12);min-width:0}
.table{grid-area:table;min-height:0;display:grid;
  grid-template-columns:minmax(58px,.8fr) minmax(0,2.4fr) minmax(58px,.8fr);
  grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:". top ." "left mid right" ". bot .";
  gap:4px;padding-block:6px;position:relative}
.dock{grid-area:dock;display:flex;flex-direction:column;gap:8px;padding-block:4px 12px;min-width:0}

/* ---- Marcador ---- */
.teams{flex:1;display:grid;gap:4px;min-width:0}
.trow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:8px}
.tname{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname.us{color:var(--us)} .tname.them{color:var(--them)}
.stones{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.stone{width:9px;height:9px;border-radius:50% 45% 55% 50%;background:rgba(241,236,224,.13)}
.stone.on.us{background:var(--us)} .stone.on.them{background:var(--them)}
.stone.gap{margin-left:5px}
.tnum{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tnum small{font-family:var(--f-body);font-size:11px;color:var(--chalk-dim);margin-left:3px}
.iconbtn{background:none;border:1px solid rgba(241,236,224,.25);color:var(--chalk);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;min-height:40px}

/* ---- Asientos ---- */
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
.seat.top{grid-area:top} .seat.left{grid-area:left;justify-content:center} .seat.right{grid-area:right;justify-content:center} .seat.bot{grid-area:bot}
.tag{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.25);max-width:100%}
.tag .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.us{background:var(--us)} .dot.them{background:var(--them)}
.seat.turn .tag{box-shadow:0 0 0 2px var(--hot)}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.badge{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-dim);border:1px solid rgba(241,236,224,.25);border-radius:4px;padding:1px 5px}
.badge.off{color:var(--them);border-color:var(--them);font-size:9px;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backs{display:flex}
.backs .card{margin-left:-15px} .backs .card:first-child{margin-left:0}
.bubble{position:absolute;z-index:5;top:-6px;left:50%;translate:-50% -100%;background:var(--chalk);color:var(--btn-ink);
  font-family:var(--f-display);font-size:18px;padding:6px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:pop .25s ease-out}
.seat.top .bubble{top:auto;bottom:-6px;translate:-50% 100%}
.seat.left .bubble{left:0;translate:0 -100%}
.seat.right .bubble{left:auto;right:0;translate:0 -100%}
@keyframes pop{from{scale:.7;opacity:0}}

/* ---- Centro de la mesa ---- */
.mid{grid-area:mid;position:relative;min-height:110px;container-type:size}
.slot{position:absolute;transform:translate(-50%,-50%)}
.slot.b{left:50%;top:72%} .slot.t{left:50%;top:28%} .slot.l{left:18%;top:50%} .slot.r{left:82%;top:50%}
.slot.dim{opacity:.55}
.slot.win .card{box-shadow:0 0 0 3px var(--hot),0 4px 10px rgba(0,0,0,.35)}
.pips{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:6px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid rgba(241,236,224,.35)}
.pip.us{background:var(--us);border-color:var(--us)} .pip.them{background:var(--them);border-color:var(--them)}
.pip.p{background:repeating-linear-gradient(45deg,var(--chalk-dim) 0 2px,transparent 2px 4px);border-color:var(--chalk-dim)}
.stakes{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:11px;color:var(--chalk-dim);white-space:nowrap;font-weight:600}

/* ---- Cartas ---- */
.card{--cw:68px;width:var(--cw);aspect-ratio:2/3;border-radius:calc(var(--cw)*.08);position:relative;flex:none;max-width:100%;
  box-shadow:0 3px 8px rgba(0,0,0,.35);background:var(--card)}
.card svg.face{display:block;width:100%;height:100%}
.card.xs{--cw:34px} .card.sm{--cw:50px}
.mid .card{--cw:min(27cqw,24cqh,100px)}
.card.back{background:radial-gradient(circle at 50% 50%,#d9a441 0 9%,transparent 10%),repeating-linear-gradient(45deg,var(--back1) 0 4px,var(--back2) 4px 8px);
  border:3px solid var(--card)}
.card.xs.back{border-width:2px}
.rv .card{--cw:34px}

/* ---- Tu mano ---- */
.status{text-align:center;font-size:14px;min-height:20px;line-height:1.35}
.status b{color:var(--hot)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:none;border-radius:12px;padding:10px 15px;font-size:15px;font-weight:800;background:var(--btn);color:var(--btn-ink);min-height:44px}
.btn.call{font-family:var(--f-display);font-weight:400;font-size:17px;background:var(--hot)}
.btn.no{background:transparent;color:var(--chalk);border:1.5px solid rgba(241,236,224,.5)}
.btn.ghost{background:rgba(0,0,0,.25);color:var(--chalk);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn:not(:disabled):active{scale:.96}
.myhand{container-type:inline-size;display:flex;gap:3cqw;justify-content:center;align-items:flex-end}
.myhand .card{--cw:min(29cqw,17vh,128px);transition:transform .15s}
.myhand button.cardbtn{background:none;border:none;padding:0;border-radius:10px;flex:none}
.myhand.live .card{box-shadow:0 0 0 3px var(--hot),0 4px 12px rgba(0,0,0,.45)}
.myhand button:disabled{cursor:default}
.myhand button.cardbtn:not(:disabled):active .card{transform:translateY(-10px) scale(1.03)}
@media (hover:hover){.myhand button.cardbtn:not(:disabled):hover .card{transform:translateY(-8px)}}
.myhand button.cardbtn:focus-visible .card{transform:translateY(-8px)}

/* ---- Hojas (sala, resumen, señas, menú) ---- */
.shade{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.45)}
.sheet{position:absolute;bottom:0;left:50%;translate:-50% 0;width:min(640px,100%);z-index:20;max-height:92%;overflow:auto;overscroll-behavior:contain;
  background:var(--chalk);color:var(--btn-ink);border-radius:18px 18px 0 0;padding:18px 16px 18px;box-shadow:0 -10px 30px rgba(0,0,0,.4);user-select:text;-webkit-user-select:text}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.sheet h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 6px;color:#5b6b5f}
.sheet p{margin:6px 0;line-height:1.45;font-size:14px;max-width:62ch}
.sheet .btn{background:var(--felt);color:var(--chalk)}
.sheet .btn.no{color:var(--btn-ink);border-color:rgba(26,42,32,.4);background:transparent}
.sheet .btn.call{background:var(--hot);color:var(--btn-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pair{border-radius:12px;padding:10px;display:grid;gap:8px;background:#e6e0d1;min-width:0}
.pair h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sl{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fffaf0;border-radius:8px;padding:8px;min-height:44px;min-width:0}
.sl .nm{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .free{color:#7b857c;font-style:italic}
.sl .btn{padding:6px 10px;min-height:34px;font-size:13px}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:#4c5a50}
input.t,select.t{font:inherit;font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid #b9b3a3;background:#fffaf0;color:var(--btn-ink);min-width:0}
.note{font-size:12.5px;color:#4c5a50;background:#e6e0d1;border-radius:10px;padding:10px 12px;line-height:1.45}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.sign{display:grid;gap:2px;text-align:left;background:#fffaf0;border:1px solid #d6cfbd;border-radius:10px;padding:10px;color:var(--btn-ink)}
.sign .g{font-size:22px} .sign .t1{font-weight:800;font-size:14px} .sign .t2{font-size:12px;color:#5b6b5f}
.summary{display:grid;gap:8px;margin:10px 0}
.sline{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed #cfc8b6;padding-bottom:6px}
.sline b{font-variant-numeric:tabular-nums}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rv{background:#e6e0d1;border-radius:10px;padding:8px;display:grid;gap:6px;min-width:0}
.rv .who{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
.rv .who span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .cs{display:flex;gap:4px}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.order .gt{font-size:12px;color:#7b857c}
.invite{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#e6e0d1;border-radius:12px;padding:10px 12px;margin-top:8px}
.invite .code{font-family:var(--f-display);font-size:30px;letter-spacing:.18em}
.linktxt{font-size:12px;color:#5b6b5f;word-break:break-all;user-select:all;-webkit-user-select:all;margin:6px 0 0}
.conn{text-align:center;font-size:13px;background:rgba(0,0,0,.3);border-radius:8px;padding:6px 10px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--chalk);
  padding:10px 14px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.4);border:1px solid rgba(241,236,224,.2)}
.toast.sig{background:var(--hot);color:var(--btn-ink);font-weight:700}
.empty{height:100%;display:grid;place-content:center;text-align:center;max-width:34ch;margin:0 auto;line-height:1.5}
.empty h1{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0 0 6px}
.empty .btn{margin-top:8px}

/* ---- Pantalla de inicio ---- */
.startpg{height:100%;overflow:auto;display:grid;align-content:start;gap:18px;padding-block:28px 24px}
.hero{display:flex;align-items:center;gap:14px}
.hero .fan{display:flex;flex:none}
.hero .fan .card{--cw:44px;margin-left:-18px;rotate:var(--r)} .hero .fan .card:first-child{margin-left:0}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0;line-height:1}
.hero p{margin:6px 0 0;max-width:40ch;line-height:1.5;color:var(--chalk-dim)}
.startsheet{position:static;translate:none;width:100%;border-radius:18px;max-height:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* ---- Horizontal: mesa a la izquierda, mano a la derecha ---- */
@media (orientation:landscape) and (max-height:620px), (orientation:landscape) and (min-width:900px){
  .game{grid-template-columns:minmax(0,1fr) minmax(250px,40%);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"table score" "table dock";column-gap:16px}
  .table{padding-block:8px}
  .dock{justify-content:flex-end;min-height:0;padding-block:6px 10px;overflow:auto}
  .myhand .card{--cw:min(28cqw,23vh,150px)}
  .startpg{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center;align-content:center}
  .hero{flex-direction:column;align-items:flex-start}
}
@media (orientation:landscape) and (max-height:620px){
  .score{padding-block:6px 4px}
  .trow{grid-template-columns:62px minmax(0,1fr) auto}
  .stones{gap:2px}
  .stone{width:7px;height:7px}
  .tnum{font-size:16px}
  .iconbtn{padding:6px 10px;min-height:36px}
  .invite{padding:6px 10px}
  .invite .code{font-size:24px}
  .sheet{width:min(860px,100%)}
  .btn{min-height:38px;padding:7px 12px;font-size:14px}
  .btn.call{font-size:15px}
  .tag{padding:3px 8px}
  .seat.bot .badges{display:none}
  .card.xs{--cw:26px}
  .sheet{max-height:100%;border-radius:18px 18px 0 0}
  .startpg{padding-block:16px}
}
@media (max-width:380px){
  .trow{grid-template-columns:60px minmax(0,1fr) auto}
  .stone{width:8px;height:8px}
  .seats{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<div id="app"><div class="empty"><h1>Truc</h1><p>Preparant la taula…</p></div></div>

<script>
window.__trucErr=function(msg){var a=document.getElementById('app');if(!a)return;a.innerHTML='<div class="empty"><h1>Truc</h1><p>'+msg+'</p></div>';};
window.addEventListener('error',function(e){
  var p=location.protocol;
  if(p!=='https:'&&p!=='http:'){window.__trucErr("Aquesta app s'ha d'obrir des d'una adreça web (https://...). Des de la vista prèvia o com a fitxer no pot connectar amb els altres mòbils.");return;}
  if(window.__trucReady)return;
  window.__trucErr("Hi ha hagut un error en carregar l'app: "+String(e.message||'desconegut')+". Torna a carregar la pàgina.");
});

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" crossorigin="anonymous"></script>
<script>
/* ===== LÒGICA DEL JOC (pura) ===== */
const SUITN={o:'oros',c:'copes',e:'espases',b:'bastos'};
const TRUC=['','Truc','Retruc','Quatre val','Joc fora'];
const TRUC_SHOUT=['','Truc!','Retruc!','Quatre val!','Joc fora!'];
const ENV=['','Envit','Torne','Falta'];
const ENV_SHOUT=['','Envide!','Torne!','La falta!'];
const team=s=>s%2;
const rk=c=>parseInt(c,10);
const su=c=>c.slice(-1);
function deck(){const d=[];for(const s of 'oceb')for(const r of [3,4,5,6,7])d.push(r+s);d.push('1e','1b');return d;}
function power(c){
  if(c==='1e')return 14; if(c==='1b')return 13; if(c==='7e')return 12; if(c==='7o')return 11;
  const r=rk(c); return r===3?10:r===7?9:r===6?8:r===5?7:6;
}
function envitOf(cards){
  const by={};cards.forEach(c=>{(by[su(c)]=by[su(c)]||[]).push(rk(c));});
  let best=0;for(const k in by){const v=by[k].sort((a,b)=>b-a);const val=v.length>=2?20+v[0]+v[1]:v[0];if(val>best)best=val;}
  return best;
}
function rint(n){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}catch(e){return Math.floor(Math.random()*n);}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const rid=()=>Math.random().toString(36).slice(2,10);

function freshGame(){return {v:0,seats:[null,null,null,null],nicks:['','','',''],cfg:{pedres:12,cames:2},phase:'lobby',score:{p:[0,0],c:[0,0]},dealer:3,hand:null,shout:null,winner:null};}
function shout(st,seat,text){st.shout={seat,text,n:((st.shout&&st.shout.n)||0)+1};}

function startHand(st){
  st.dealer=(st.dealer+1)%4; const ma=(st.dealer+1)%4; const d=shuffle(deck());
  const cards={},dealt={};
  for(let i=0;i<4;i++){const s=(ma+i)%4;cards[s]=d.slice(i*3,i*3+3);dealt[s]=cards[s].slice();}
  st.hand={id:rid(),ma,cards,dealt,tricks:[{lead:ma,plays:[]}],results:[],turn:ma,
    truc:{level:0,holder:null},envit:{state:'none',level:0,pts:0,team:null},pending:null,saved:null,summary:null};
  st.phase='playing'; st.winner=null; return st;
}
function playedFirst(h,s){return h.tricks[0].plays.some(p=>p.seat===s);}
function canEnvit(h,s){return h.tricks.length===1&&!playedFirst(h,s)&&h.envit.state==='none';}
function canTruc(h,s){return h.truc.level<4&&(h.truc.holder===null||h.truc.holder===team(s));}

function decide(r,ma){
  if(r.length>=2){
    if(r[0]!=='p'&&(r[1]===r[0]||r[1]==='p'))return r[0];
    if(r[0]==='p'&&r[1]!=='p')return r[1];
  }
  if(r.length===3){ if(r[2]!=='p')return r[2]; if(r[0]!=='p')return r[0]; return team(ma); }
  return null;
}
function addPts(st,t,n){st.score.p[t]+=n;if(st.score.p[t]>=st.cfg.pedres){st.score.c[t]++;st.score.p=[0,0];return true;}return false;}
function endHand(st,winT,refusedPts){
  const h=st.hand,target=st.cfg.pedres,lead=Math.max(st.score.p[0],st.score.p[1]);
  const sum={handTeam:winT,trucPts:0,trucLevel:h.truc.level,trucRefused:refusedPts!=null,trucApplied:true,env:null,cama:null,before:st.score.p.slice()};
  let camaT=null;
  if(h.envit.state==='accepted'){
    const order=[0,1,2,3].map(i=>(h.ma+i)%4),vals={};order.forEach(s=>{vals[s]=envitOf(h.dealt[s]);});
    let bs=order[0];order.forEach(s=>{if(vals[s]>vals[bs])bs=s;});
    const t=team(bs),pts=h.envit.level===1?2:h.envit.level===2?4:Math.max(1,target-lead);
    sum.env={team:t,pts,seat:bs,vals,accepted:true,level:h.envit.level};
    if(addPts(st,t,pts))camaT=t;
  }else if(h.envit.state==='refused'){
    sum.env={team:h.envit.team,pts:h.envit.pts,accepted:false,level:h.envit.level};
    if(addPts(st,h.envit.team,h.envit.pts))camaT=h.envit.team;
  }
  if(camaT===null){
    let n;
    if(refusedPts!=null)n=refusedPts;
    else if(h.truc.level===4)n=Math.max(1,target-st.score.p[winT]);
    else n=[1,2,3,4][h.truc.level];
    sum.trucPts=n; if(addPts(st,winT,n))camaT=winT;
  }else sum.trucApplied=false;
  sum.cama=camaT;
  if(camaT!==null&&st.score.c[camaT]>=st.cfg.cames){st.phase='gameEnd';st.winner=camaT;}else st.phase='handEnd';
  h.summary=sum;h.pending=null;h.saved=null;h.turn=-1;
  return st;
}
function playCard(st,seat,card){
  const h=st.hand;
  if(st.phase!=='playing'||!h)return 'Ara no es pot tirar.';
  if(h.pending)return 'Primer cal respondre l\'aposta.';
  if(h.turn!==seat)return 'No et toca.';
  const mine=h.cards[seat],i=mine.indexOf(card); if(i<0)return 'Eixa carta no és teua.';
  mine.splice(i,1);
  const tr=h.tricks[h.tricks.length-1]; tr.plays.push({seat,card});
  if(tr.plays.length<4){h.turn=(seat+1)%4;return st;}
  const max=Math.max(...tr.plays.map(p=>power(p.card)));
  const top=tr.plays.filter(p=>power(p.card)===max);
  const first=top[0].seat; const res=top.every(p=>team(p.seat)===team(first))?team(first):'p';
  tr.res=res;tr.best=first;h.results.push(res);
  const w=decide(h.results,h.ma);
  if(w!==null)return endHand(st,w,null);
  h.tricks.push({lead:first,plays:[]});h.turn=first;return st;
}
function callTruc(st,seat){
  const h=st.hand;
  if(st.phase!=='playing'||!h||h.pending||h.turn!==seat)return 'Ara no pots trucar.';
  if(!canTruc(h,seat))return 'Ara no et toca pujar el truc.';
  h.pending={kind:'truc',level:h.truc.level+1,by:team(seat),seat};
  shout(st,seat,TRUC_SHOUT[h.pending.level]);return st;
}
function callEnvit(st,seat,level){
  const h=st.hand;
  if(st.phase!=='playing'||!h||h.pending||h.turn!==seat)return 'Ara no pots envidar.';
  if(!canEnvit(h,seat))return 'L\'envit només es pot cantar en la primera baza, abans de tirar.';
  h.pending={kind:'envit',level,by:team(seat),seat,prevVal:1};
  shout(st,seat,ENV_SHOUT[level]);return st;
}
function respond(st,seat,resp,arg){
  const h=st.hand,p=h&&h.pending;
  if(st.phase!=='playing'||!p)return 'No hi ha cap aposta per respondre.';
  if(team(seat)===p.by)return 'Ha de respondre l\'altra parella.';
  const T=team(seat);
  if(resp==='vull'){
    shout(st,seat,'Vull!');
    if(p.kind==='truc'){h.truc.level=p.level;h.truc.holder=T;h.pending=null;}
    else{h.envit.state='accepted';h.envit.level=p.level;h.pending=h.saved;h.saved=null;}
    return st;
  }
  if(resp==='novull'){
    shout(st,seat,'No vull');
    if(p.kind==='truc')return endHand(st,p.by,p.level);
    h.envit.state='refused';h.envit.level=p.level;h.envit.team=p.by;h.envit.pts=p.prevVal;
    h.pending=h.saved;h.saved=null;return st;
  }
  if(resp==='raise'){
    if(p.kind==='truc'){
      if(p.level>=4)return 'Ja no es pot pujar més.';
      h.truc.level=p.level;h.pending={kind:'truc',level:p.level+1,by:T,seat};
      shout(st,seat,TRUC_SHOUT[p.level+1]);return st;
    }
    const nl=arg; if(!(nl>p.level&&nl<=3))return 'Eixa pujada no és vàlida.';
    h.pending={kind:'envit',level:nl,by:T,seat,prevVal:p.level===1?2:4};
    shout(st,seat,ENV_SHOUT[nl]);return st;
  }
  if(resp==='envit'){
    if(p.kind!=='truc'||p.level!==1||h.saved||!canEnvit(h,seat))return 'Ara no pots envidar.';
    h.saved=p;h.pending={kind:'envit',level:arg||1,by:T,seat,prevVal:1};
    shout(st,seat,'L\'envit va primer! '+ENV_SHOUT[arg||1]);return st;
  }
  return 'Resposta desconeguda.';
}
/* ===== FI LÒGICA ===== */
</script>

<script>
/* ===== INTERFÍCIE I XARXA (sense comptes: PeerJS, l'amfitrió porta la partida) ===== */
const SIGNS=[
  {k:'amo',g:'🤨',t:'L\'amo',d:'As d\'espases · alçar les celles'},
  {k:'bastot',g:'😉',t:'El bastot',d:'As de bastos · fer l\'ullet'},
  {k:'me',g:'😜',t:'Manilla d\'espases',d:'Set d\'espases · llengua a la dreta'},
  {k:'mo',g:'😛',t:'Manilla d\'oros',d:'Set d\'oros · llengua a l\'esquerra'},
  {k:'tres',g:'😬',t:'Un tres',d:'Mossegar-se el llavi'},
  {k:'res',g:'😑',t:'No tinc res',d:'Tancar els ulls'},
  {k:'env',g:'😮‍💨',t:'Tinc bon envit',d:'Inflar les galtes'},
  {k:'envida',g:'🙂',t:'Envida!',d:'Assentir amb el cap'},
  {k:'truca',g:'👊',t:'Truca!',d:'Picar a la taula'},
  {k:'no',g:'🙅',t:'No vulgues',d:'Negar amb el cap'},
];
const PREFIX='truc-colla-vlc-';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

let mode='start';           // start | host | client
let state=null;             // la vista que veu aquest dispositiu
let conn=null, peer=null, code='', myName=ls.get('truc-name')||'', connMsg='', retryTimer=null;
let sheet=null, toastTimer=null, bubble=null, lastShoutN=null;
// només a l'amfitrió
let G=null, players={}, HOST_TOKEN='amfitrio';

/* Cartas de la baraja española dibujadas en SVG (100 x 150).
   La «pinta» del marco indica el palo: oros sin cortes, copas 1, espadas 2, bastos 3. */
const PIP_POS={
  3:[[30,38],[70,75],[30,112]],
  4:[[30,40],[70,40],[30,110],[70,110]],
  5:[[30,38],[70,38],[50,75],[30,112],[70,112]],
  6:[[30,36],[70,36],[30,75],[70,75],[30,114],[70,114]],
  7:[[30,33],[70,33],[50,55],[30,80],[70,80],[30,117],[70,117]],
};
function pintaLine(x1,x2,y,gaps){
  if(!gaps)return `M${x1} ${y}H${x2}`;
  const g=5, seg=(x2-x1-g*gaps)/(gaps+1); let d='', x=x1;
  for(let i=0;i<=gaps;i++){d+=`M${x.toFixed(1)} ${y}H${(x+seg).toFixed(1)}`;x+=seg+g;}
  return d;
}
function cardSVG(c){
  const r=rk(c), s=su(c), gaps={o:0,c:1,e:2,b:3}[s];
  const frame=`<path d="${pintaLine(20,93,7,gaps)}${pintaLine(7,80,143,gaps)}M7 26V143M93 7V124" stroke="#3a3128" stroke-width="1.4" fill="none"/>`;
  const idx=`<text x="9" y="22" font-family="Young Serif, Georgia, serif" font-size="19" fill="#221d17">${r}</text>`;
  let pips='';
  if(r===1){
    pips=`<ellipse cx="50" cy="128" rx="24" ry="4" fill="#000" opacity=".08"/><use href="#p-${s}" x="12" y="33" width="76" height="86"/>`;
    if(s==='e'||s==='b')pips+=`<path d="M27 92 C40 84 60 98 73 86 M30 66 C42 58 58 72 70 60" stroke="#6fb7de" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".95"/>`;
    if(s==='o')pips+=`<circle cx="50" cy="76" r="40" fill="none" stroke="#e3a81c" stroke-width="1" stroke-dasharray="2 4"/>`;
  }else{
    pips=PIP_POS[r].map(([x,y],i)=>{
      const sz=31, id=(s==='b'&&i%2)?'p-b2':'p-'+s;
      const tilt=(s==='b'||s==='e')?(i%2?14:-14):0;
      return `<use href="#${id}" x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}"${tilt?` transform="rotate(${tilt} ${x} ${y})"`:''}/>`;
    }).join('');
  }
  return `<svg class="face" viewBox="0 0 100 150" aria-hidden="true"><rect x=".75" y=".75" width="98.5" height="148.5" rx="7.5" fill="#fbf7ec" stroke="#cdbf9c" stroke-width="1.5"/>${frame}${idx}<g transform="rotate(180 50 75)">${idx}</g>${pips}</svg>`;
}
function cardHTML(c,size){
  if(!c)return `<div class="card back ${size||''}"></div>`;
  const r=rk(c),s=su(c);
  return `<div class="card ${size||''}" role="img" aria-label="${r===1?'As':r} de ${SUITN[s]}">${cardSVG(c)}</div>`;
}
function toast(msg,cls){
  let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.className='toast '+(cls||''); t.textContent=msg; t.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.hidden=true;},cls==='sig'?4200:3000);
}
const rcode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rint(a.length)];return s;};

/* ---------- AMFITRIÓ ---------- */
function viewFor(token){
  const st=JSON.parse(JSON.stringify(G));
  const mine=G.seats.map((u,i)=>u===token?i:-1).filter(i=>i>=0);
  st.mine=mine;
  st.online=G.seats.map(u=>!!u&&(u===HOST_TOKEN||!!(players[u]&&players[u].open)));
  st.seats=G.seats.map((u,i)=>u?'j'+i:null);
  if(st.hand){
    const h=st.hand;
    for(const s of [0,1,2,3]){ if(!mine.includes(s)) h.cards[s]=(h.cards[s]||[]).map(()=>null); }
    if(!(G.phase==='handEnd'||G.phase==='gameEnd'))h.dealt={};
  }
  return st;
}
function broadcast(){
  for(const tk in players){const p=players[tk];if(p.open&&p.conn){try{p.conn.send({t:'state',st:viewFor(tk)});}catch(e){}}}
  onView(viewFor(HOST_TOKEN));
  ls.set('truc-host',JSON.stringify({code,G,names:Object.fromEntries(Object.entries(players).map(([k,v])=>[k,v.name]))}));
}
function sendTo(token,msg){
  if(token===HOST_TOKEN){hostLocal(msg);return;}
  const p=players[token]; if(p&&p.open&&p.conn){try{p.conn.send(msg);}catch(e){}}
}
function hostLocal(msg){ if(msg.t==='err')toast(msg.msg); if(msg.t==='sign')showSign(msg); }
function owns(token,s){return s>=0&&s<4&&G.seats[s]===token;}
function handle(token,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='sign'){
    if(!owns(token,m.seat)||!G.hand)return;
    const pt=G.seats[(m.seat+2)%4]; if(pt)sendTo(pt,{t:'sign',from:m.seat,k:String(m.k)});
    return;
  }
  if(m.t!=='act')return;
  const name=token===HOST_TOKEN?myName:(players[token]&&players[token].name)||'';
  const st=JSON.parse(JSON.stringify(G)); let res;
  const a=m.a, s=m.s|0;
  switch(a){
    case 'sit': if(st.phase!=='lobby'){res='La partida ja ha començat.';break;}
      if(st.seats[s]&&st.seats[s]!==token){res='Eixe seient ja està ocupat.';break;}
      st.seats[s]=token; st.nicks[s]=String(name).slice(0,18); res=st; break;
    case 'stand': if(st.phase!=='lobby'||st.seats[s]!==token){res='Ara no pots alçar-te.';break;}
      st.seats[s]=null; st.nicks[s]=''; res=st; break;
    case 'cfg': if(st.phase!=='lobby'){res='Només es pot canviar abans de començar.';break;}
      if(m.k==='pedres'&&[12,24].includes(m.v))st.cfg.pedres=m.v; if(m.k==='cames'&&[1,2].includes(m.v))st.cfg.cames=m.v; res=st; break;
    case 'start': if(st.phase!=='lobby'){res='La partida ja ha començat.';break;}
      if(st.seats.some(x=>!x)){res='Falten jugadors per seure.';break;}
      st.score={p:[0,0],c:[0,0]}; st.dealer=rint(4); res=startHand(st); break;
    case 'next': res=st.phase==='handEnd'?startHand(st):'La mà encara no ha acabat.'; break;
    case 'newgame': if(st.phase!=='gameEnd'){res='La partida encara no ha acabat.';break;} st.score={p:[0,0],c:[0,0]}; res=startHand(st); break;
    case 'lobby': if(!st.seats.includes(token)){res='Només ho pot fer qui està assegut.';break;}
      st.phase='lobby';st.hand=null;st.shout=null;st.score={p:[0,0],c:[0,0]};st.winner=null;res=st;break;
    default:
      if(!owns(token,s)){res='Eixe seient no és teu.';break;}
      if(a==='play')res=playCard(st,s,String(m.c));
      else if(a==='truc')res=callTruc(st,s);
      else if(a==='envit')res=callEnvit(st,s,m.l===3?3:1);
      else if(a==='resp')res=respond(st,s,m.r,m.x);
      else res='Acció desconeguda.';
  }
  if(typeof res==='string'){if(['sit','stand','cfg','lobby','start','next','newgame'].includes(a)||res)sendTo(token,{t:'err',msg:res});return;}
  if(['sit','stand'].includes(a)&&players[token])players[token].name=name;
  G=res; G.v=(G.v||0)+1; broadcast();
}
function startHost(resume){
  mode='host'; connMsg='Obrint la taula…'; render();
  if(resume){G=resume.G; code=resume.code; for(const k in (resume.names||{}))players[k]={name:resume.names[k],open:false,conn:null};}
  else{G=freshGame(); code=rcode();}
  openHostPeer(0);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
}
function openHostPeer(tries){
  try{peer&&peer.destroy();}catch(e){}
  try{peer=new Peer(PREFIX+code);}catch(err){connMsg='No es pot obrir la connexió en aquest navegador: '+(err&&err.message||err);render();return;}
  peer.on('open',()=>{connMsg='';broadcast();});
  peer.on('connection',c=>{
    c.on('data',m=>{
      if(m&&m.t==='hello'){
        const tk=String(m.token||'').slice(0,40); if(!tk||tk===HOST_TOKEN)return;
        const old=players[tk]; if(old&&old.conn&&old.conn!==c){try{old.conn.close();}catch(e){}}
        players[tk]={conn:c,open:true,name:String(m.name||'').slice(0,18)};
        c._tk=tk;
        G.seats.forEach((u,i)=>{if(u===tk)G.nicks[i]=players[tk].name;});
        broadcast(); return;
      }
      if(c._tk)handle(c._tk,m);
    });
    c.on('close',()=>{const p=c._tk&&players[c._tk];if(p&&p.conn===c){p.open=false;broadcast();}});
    c.on('error',()=>{});
  });
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      if(tries<4){connMsg='Recuperant la taula…';render();setTimeout(()=>openHostPeer(tries+1),4000);}
      else{code=rcode();openHostPeer(0);toast('La taula anterior no estava lliure. He obert una taula nova amb un altre codi.');}
    }else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){
      connMsg='Sense connexió amb el servidor. Reintentant…';render();setTimeout(()=>openHostPeer(tries),4000);
    }
  });
}
/* ---------- CONVIDAT ---------- */
function myToken(){
  const k='truc-token:'+code+':'+myName.toLowerCase();
  let t=ls.get(k); if(!t){t=rid()+rid();ls.set(k,t);} return t;
}
function startClient(){
  mode='client'; connMsg='Connectant amb la taula '+code+'…'; render();
  try{peer&&peer.destroy();}catch(e){}
  try{peer=new Peer();}catch(err){connMsg='No es pot obrir la connexió en aquest navegador: '+(err&&err.message||err);render();return;}
  peer.on('open',connectToHost);
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){connMsg=`No trobe la taula ${code}. Comprova el codi i que l'amfitrió tinga l'app oberta. Reintentant…`;render();scheduleRetry();}
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){connMsg='Sense connexió. Reintentant…';render();scheduleRetry();}
  });
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
}
function scheduleRetry(){clearTimeout(retryTimer);retryTimer=setTimeout(()=>{if(peer&&!peer.destroyed&&!peer.disconnected)connectToHost();else startClient();},3500);}
function connectToHost(){
  try{conn&&conn.close();}catch(e){}
  conn=peer.connect(PREFIX+code,{reliable:true});
  conn.on('open',()=>{connMsg='';conn.send({t:'hello',token:myToken(),name:myName});render();});
  conn.on('data',m=>{
    if(!m)return;
    if(m.t==='state')onView(m.st);
    else if(m.t==='err')toast(m.msg);
    else if(m.t==='sign')showSign(m);
  });
  conn.on('close',()=>{connMsg='S\'ha perdut la connexió. Reconnectant…';render();scheduleRetry();});
  conn.on('error',()=>{});
}
function send(m){
  if(mode==='host'){handle(HOST_TOKEN,m);return;}
  if(conn&&conn.open){try{conn.send(m);}catch(e){toast('No s\'ha pogut enviar. Torna-ho a provar.');}}
  else toast('Ara mateix no hi ha connexió amb la taula.');
}

function canFS(){return !!(document.documentElement.requestFullscreen&&document.fullscreenEnabled);}
function toggleFS(){

    else document.documentElement.requestFullscreen({navigationUI:'hide'}).then(render).catch(()=>{toast('Aquest navegador no permet la pantalla completa.');render();});
  }catch(e){toast('Aquest navegador no permet la pantalla completa.');render();}
}
let lastNeed='';
function buzz(st){
  const h=st&&st.hand; let need='';
  if(h&&st.phase==='playing'){const ms=st.mine||[];
    if(h.pending&&ms.some(x=>team(x)!==h.pending.by))need='p'+h.pending.kind+h.pending.level+(h.tricks||[]).length;
    else if(!h.pending&&ms.includes(h.turn))need='t'+h.turn+'-'+(h.tricks||[]).length+'-'+(h.tricks[h.tricks.length-1].plays||[]).length;}
  if(need&&need!==lastNeed){try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}}
  lastNeed=need;
}
function onView(st){
  buzz(st);
  state=st;
  const sh=st&&st.shout;
  if(sh&&lastShoutN!==null&&sh.n!==lastShoutN){bubble={seat:sh.seat,text:sh.text};const n=sh.n;setTimeout(()=>{if(bubble&&lastShoutN===n){bubble=null;render();}},2600);}
  lastShoutN=sh?sh.n:0;
  if(sheet==='signs'&&!(st&&st.phase==='playing'))sheet=null;
  render();
}
function showSign(m){

  const sg=SIGNS.find(s=>s.k===m.k); if(sg)toast(`Senya de ${nameOf(m.from)}: ${sg.g} ${sg.t}`,'sig');

function mySeats(){return state&&state.mine?state.mine:[];}
function meSeat(){
  const ms=mySeats(); if(!ms.length)return -1; if(ms.length===1)return ms[0];

  if(h&&state.phase==='playing'){
    if(h.pending){const r=ms.find(s=>team(s)!==h.pending.by);if(r!=null)return r;}
    if(ms.includes(h.turn))return h.turn;

}
function nameOf(s){return (state&&state.nicks&&state.nicks[s])||('Seient '+(s+1));}
const doPlay=c=>send({t:'act',a:'play',s:meSeat(),c});

function seatHTML(s,base,h){

function midHTML(base,h){
  if(!h)return `<div class="mid"></div>`;

  let tr=h.tricks[h.tricks.length-1], dim=false;
  if(!tr.plays.length&&h.tricks.length>1){tr=h.tricks[h.tricks.length-2];dim=true;}
  const slots=tr.plays.map(p=>`<div class="slot ${SLOT[rel(p.seat,b)]} ${dim?'dim':''} ${(dim||state.phase!=='playing')&&tr.best===p.seat&&tr.res!=='p'?'win':''}">${cardHTML(p.card,'sm')}</div>`).join('');
  const pips=[0,1,2].map(i=>{const r=h.results[i];if(r==null)return '<span class="pip"></span>';if(r==='p')return '<span class="pip p" title="Parda"></span>';return `<span class="pip ${teamCls(r,base)}"></span>`;}).join('');

function actionsFor(me,h){
  const A=[]; let status='';
  if(!h||state.phase!=='playing')return {A,status};
  const p=h.pending;
  if(me<0){status=p?`${esc(nameOf(p.seat))} ha cantat <b>${p.kind==='truc'?TRUC[p.level]:ENV[p.level]}</b>`:`Torn de ${esc(nameOf(h.turn))}`;return {A,status};}
  const T=team(me);
  if(p){
    const what=p.kind==='truc'?TRUC[p.level]:ENV[p.level];
    if(p.by!==T){
      status=`${esc(nameOf(p.seat))} diu <b>${what}</b>. Què respons?`;
      A.push({l:'Vull',c:'btn',f:()=>doResp('vull')},{l:'No vull',c:'btn no',f:()=>doResp('novull')});
      if(p.kind==='truc'&&p.level<4)A.push({l:TRUC[p.level+1],c:'btn call',f:()=>doResp('raise')});
      if(p.kind==='envit'){if(p.level<2)A.push({l:'Torne',c:'btn call',f:()=>doResp('raise',2)});if(p.level<3)A.push({l:'Falta',c:'btn call',f:()=>doResp('raise',3)});}
      if(p.kind==='truc'&&p.level===1&&!h.saved&&canEnvit(h,me))A.push({l:'Envide',c:'btn call',f:()=>doResp('envit',1)},{l:'La falta',c:'btn call',f:()=>doResp('envit',3)});
    }else status=`${p.seat===me?'Has':esc(nameOf(p.seat))+' ha'} cantat <b>${what}</b>. Esperant resposta…`;
    return {A,status};
  }
  if(h.turn===me){
    status='<b>Et toca.</b> Tira una carta o aposta.';
    if(canTruc(h,me))A.push({l:TRUC[h.truc.level+1],c:'btn call',f:doTruc});
    if(canEnvit(h,me))A.push({l:'Envide',c:'btn call',f:()=>doEnvit(1)},{l:'La falta',c:'btn call',f:()=>doEnvit(3)});
  }else status=`Torn de ${esc(nameOf(h.turn))}`;
  return {A,status};
}

function needName(){
  myName=($('#nm')?$('#nm').value:myName).trim().slice(0,18);
  if(!myName){toast('Escriu el teu nom per a entrar.');return false;}
  ls.set('truc-name',myName);return true;
}
async function copyLink(){
  const l=joinLink();
  try{await navigator.clipboard.writeText(l);toast('Enllaç copiat');}catch(e){toast('Copia l\'enllaç que apareix davall del codi.');}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el)return;
  const a=el.dataset.a, me=meSeat();
  if(a==='act'){const x=curActions[+el.dataset.i];if(x)x.f();}
  else if(a==='play')doPlay(el.dataset.c);
  else if(['sit','stand'].includes(a))send({t:'act',a,s:+el.dataset.s});
  else if(['start','next','newgame'].includes(a))send({t:'act',a,s:me});
  else if(a==='lobby'){sheet=null;send({t:'act',a:'lobby',s:me});}
  else if(a==='sign')sendSign(el.dataset.k);
  else if(a==='join'){
    if(!needName())return; code=($('#cd').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(code.length<4){toast('Escriu el codi de la taula.');return;}
    try{history.replaceState(null,'',location.href.split('#')[0]+'#'+code);}catch(err){} startClient();
  }
  else if(a==='host'){if(!needName())return;startHost(null);}
  else if(a==='resume'){if(!needName())return;try{startHost(JSON.parse(ls.get('truc-host')));}catch(err){toast('No s\'ha pogut recuperar la taula.');}}
  else if(a==='copy')copyLink();
  else if(a==='share'){navigator.share({title:'Truc',text:'Vine a jugar al truc! Codi '+code,url:joinLink()}).catch(()=>{});}
  else if(a==='leave'){if(mode==='host')ls.set('truc-host',JSON.stringify({code,G,names:Object.fromEntries(Object.entries(players).map(([k,v])=>[k,v.name]))}));leave();}
  else if(a==='fs'){sheet=null;toggleFS();}
  else if(a==='close'){sheet=null;render();}
  else if(['menu','rules','signs','lobbyask','leaveask'].includes(a)){sheet=a;render();}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&mode!=='start'){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
    if(mode==='client'&&(!conn||!conn.open))scheduleRetry();
    if(peer&&peer.disconnected&&!peer.destroyed){try{peer.reconnect();}catch(e){}}}
});
const WEB=/^https?:$/.test(location.protocol);
if(!WEB){window.__trucErr("Aquesta app s'ha d'obrir des d'una adreça web (https://...). Des de la vista prèvia o com a fitxer no pot connectar amb els altres mòbils. Puja el fitxer a una web (per exemple GitHub Pages o Netlify) i obri'l des d'allà.");}
else if(typeof Peer==='undefined'){document.getElementById('app').innerHTML='<div class="empty"><h1>Truc</h1><p>No s\'ha pogut carregar el mòdul de connexió. Comprova que tens internet i torna a carregar la pàgina.</p></div>';}
else{window.__trucReady=true;render();}

</script>
